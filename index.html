<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>这猫 The Cat · 技术支持</title><style>body{font:18px/1.8 system-ui,sans-serif;max-width:760px;margin:60px auto;padding:0 24px;color:#222}a{color:#2459a6}</style><h1>这猫 The Cat</h1><p>用飞鱼精准击中猫咪的休闲小游戏。</p><h2>怎么玩</h2><p>点击屏幕开始，再次点击游戏区域发射飞鱼。距离越远，得分越高。击空后点击重新开始。右上角可暂停；切到后台后返回菜单，点击“回到游戏”继续。</p><h2>支持与反馈</h2><p>如遇到运行、声音或分数问题，请发送设备型号、系统版本及问题描述至 <a href="mailto:magicvoid@me.com">magicvoid@me.com</a>。本地游戏无需注册；Game Center 排行榜需要 Apple 账号及网络。</p><p><a href="privacy.html">隐私政策</a> · <a href="https://apps.apple.com/app/id937700130">App Store</a></p></html>
